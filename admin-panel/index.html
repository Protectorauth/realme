<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login</title>
    <link rel="stylesheet" href="./admin.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h1>Admin Panel</h1>
        <p class="subtitle">User management for RealMe login</p>
        <form id="adminLoginForm">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <p id="loginError" class="error" hidden></p>
            <button type="submit" class="btn primary" id="loginSubmitBtn">
                <span class="btn-label">Log in</span>
                <span class="btn-spinner" hidden aria-hidden="true"></span>
            </button>
        </form>
    </div>
    <script src="../assets/realme-env.js"></script>
    <script src="../assets/api-config.js"></script>
    <script src="./admin.js"></script>
    <script>
        (function () {
            var form = document.getElementById("adminLoginForm");
            var errorEl = document.getElementById("loginError");
            var submitBtn = document.getElementById("loginSubmitBtn");
            var btnLabel = submitBtn.querySelector(".btn-label");
            var btnSpinner = submitBtn.querySelector(".btn-spinner");
            var usernameInput = document.getElementById("username");
            var passwordInput = document.getElementById("password");

            function setLoginLoading(isLoading) {
                submitBtn.disabled = isLoading;
                submitBtn.setAttribute("aria-busy", isLoading ? "true" : "false");
                usernameInput.disabled = isLoading;
                passwordInput.disabled = isLoading;
                btnLabel.hidden = isLoading;
                btnSpinner.hidden = !isLoading;
            }

            form.addEventListener("submit", async function (event) {
                event.preventDefault();
                errorEl.hidden = true;
                setLoginLoading(true);

                try {
                    await AdminAPI.login(
                        usernameInput.value.trim(),
                        passwordInput.value.trim()
                    );
                    window.location.href = "./dashboard.html";
                } catch (err) {
                    setLoginLoading(false);
                    errorEl.textContent = err.message || "Login failed.";
                    errorEl.hidden = false;
                }
            });
        })();
    </script>
</body>
</html>
